<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Vật Lý - Space Education</title>
    <link rel="icon" href="logo.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --deep-red: #b71c1c; 
            --light-red: rgba(183, 28, 28, 0.2); 
            --text-dark: #e2e8f0; /* Chữ màu sáng */
            --bg-gray: #05050a; /* Nền tối */
            --white: #14141e; /* Nền khối module tối */
            --sidebar-width: 260px; 
            --border-color: #2a2a35; /* Viền xám đen */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-dark); overflow-x: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* ================= HEADER & SIDEBAR CƠ BẢN ================= */
        header { background-color: var(--white); height: 80px; display: flex; align-items: center; padding: 0 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 99; flex-shrink: 0; border-bottom: 1px solid var(--border-color);}
        .header-left-group { display: flex; align-items: center; gap: 18px; }
        .menu-btn { font-size: 24px; color: var(--deep-red); background: none; border: none; cursor: pointer; transition: 0.2s; }
        .logo-text-group { display: flex; flex-direction: column; justify-content: center; }
        .logo-text { font-size: 22px; font-weight: 900; color: var(--deep-red); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; text-shadow: 0 0 5px rgba(183,28,28,0.5);}

        .sidebar { position: fixed; top: 0; left: calc(-1 * var(--sidebar-width)); width: var(--sidebar-width); height: 100vh; background-color: var(--white); box-shadow: 4px 0 25px rgba(0,0,0,0.8); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column; border-right: 1px solid var(--border-color);}
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-logo { color: var(--deep-red); font-size: 20px; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 20px; color: #a0aec0; cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 20px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 15px 25px; color: var(--text-dark); text-decoration: none; font-weight: 500; font-size: 16px; transition: 0.2s; }
        .sidebar-menu li a i { width: 30px; font-size: 18px; color: var(--deep-red); }
        .sidebar-menu li a:hover, .sidebar-menu li a.active-link { background-color: var(--light-red); color: #fff; border-right: 4px solid var(--deep-red); }
        
        .sidebar-menu li.dropdown { flex-direction: column; align-items: flex-start; padding: 0; }
        .dropdown-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; background: none; border: none; font-size: 16px; font-weight: 500; color: var(--text-dark); cursor: pointer; transition: 0.2s; }
        .dropdown-btn i.left-icon { width: 30px; font-size: 18px; color: var(--deep-red); text-align: left; }
        .dropdown-btn:hover { background-color: var(--light-red); color: #fff; }
        .dropdown-container { display: none; background-color: rgba(0,0,0,0.3); width: 100%; flex-direction: column; overflow: hidden; }
        .dropdown-container a { padding: 12px 25px 12px 55px; font-size: 15px; border-left: 4px solid transparent; }
        .dropdown-container a:hover { border-left: 4px solid var(--deep-red); background-color: rgba(255,255,255,0.05); color: #fff;}
        .dropdown-container.active { display: flex; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s; }
        .overlay.active { display: block; opacity: 1; }

        /* ================= KHU VỰC LAB VẬT LÝ ================= */
        .lab-container { flex: 1; display: flex; padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%; gap: 20px; height: calc(100vh - 80px); }
        
        /* CỘT TRÁI: MENU CHỌN BÀI (LIST) */
        .lab-sidebar { width: 320px; background: var(--white); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; flex-shrink: 0; }
        .lab-sidebar-header { padding: 20px; background: var(--deep-red); color: white; text-align: center; font-weight: 900; font-size: 18px; letter-spacing: 1px; box-shadow: 0 0 10px rgba(183,28,28,0.5);}
        .lab-list-container { flex: 1; overflow-y: auto; padding: 15px; }
        
        .lab-list-container::-webkit-scrollbar { width: 6px; }
        .lab-list-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .category-title { font-size: 13px; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin: 15px 0 10px 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        
        .sim-item { width: 100%; text-align: left; background: none; border: 1px solid transparent; padding: 12px 15px; font-size: 14px; font-weight: 600; color: var(--text-dark); cursor: pointer; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .sim-item i { color: #64748b; width: 20px; text-align: center; transition: 0.2s; }
        .sim-item:hover { background: #1e1e2d; border-color: #334155; }
        .sim-item.active { background: var(--light-red); color: #fff; border-color: var(--light-red); box-shadow: 0 2px 5px rgba(183, 28, 28, 0.3); }
        .sim-item.active i { color: #fff; }

        /* CỘT PHẢI: IFRAME HIỂN THỊ (VIEWER) */
        .lab-viewer { flex: 1; background: var(--white); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); border: 1px solid var(--border-color); overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .viewer-header { padding: 15px 25px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .viewer-title { font-size: 18px; font-weight: 800; color: var(--text-dark); }
        .viewer-badge { background: #2980b9; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; box-shadow: 0 0 5px rgba(41,128,185,0.5);}
        
        .iframe-container { flex: 1; width: 100%; position: relative; background: #000; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a10; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.5s ease; pointer-events: none;}
        .loading-overlay i { font-size: 50px; color: #475569; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        .loading-overlay p { color: #94a3b8; font-weight: 600; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }

        @media (max-width: 992px) {
            .lab-container { flex-direction: column; height: auto; }
            .lab-sidebar { width: 100%; max-height: 300px; }
            .lab-viewer { height: 60vh; min-height: 500px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">SPACE EDU</div>
            <button class="close-btn" id="close-btn"><i class="fas fa-times"></i></button>
        </div>
        
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Trang chủ</a></li>
            <li class="dropdown">
                <button class="dropdown-btn" id="phong-luyen-btn">
                    <div><i class="fas fa-laptop-code left-icon"></i> Phòng luyện thi</div>
                    <i class="fas fa-chevron-down" id="phong-luyen-icon"></i>
                </button>
                <div class="dropdown-container" id="phong-luyen-menu">
                    <a href="danhsachde.html?kithi=thptqg">Kỳ thi THPTQG</a>
                    <a href="danhsachde.html?kithi=tsa">Kỳ thi TSA</a>
                </div>
            </li>
            <li class="dropdown">
                <button class="dropdown-btn" id="space-lab-btn">
                    <div><i class="fas fa-flask left-icon"></i> Space Lab</div>
                    <i class="fas fa-chevron-down" id="space-lab-icon"></i>
                </button>
                <div class="dropdown-container active" id="space-lab-menu">
                    <a href="labmath.html"><i class="fas fa-square-root-variable" style="width: 25px; text-align: center; color: #a0aec0; margin-right: 5px;"></i> Lab Toán Học</a>
                    <a href="labphysics.html" style="border-left: 4px solid var(--deep-red); background-color: rgba(255,255,255,0.05); color: #fff;"><i class="fas fa-magnet" style="width: 25px; text-align: center; color: var(--deep-red); margin-right: 5px;"></i> Lab Vật Lý</a>
                </div>
            </li>
            <li><a href="khoahoc.html"><i class="fas fa-chalkboard-teacher"></i> Khóa học</a></li>
        </ul>
    </aside>

    <header>
        <div class="header-left-group">
            <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
            <div class="logo-text-group">
                <div class="logo-text"><i class="fas fa-magnet" style="margin-right: 8px;"></i> SPACE LAB - LÝ</div>
            </div>
        </div>
    </header>

    <main class="lab-container">
        <aside class="lab-sidebar">
            <div class="lab-sidebar-header">
                <i class="fas fa-atom"></i> DANH SÁCH MÔ PHỎNG
            </div>
            <div class="lab-list-container" id="simulation-list"></div>
        </aside>

        <section class="lab-viewer">
            <div class="viewer-header">
                <div class="viewer-title" id="viewer-title">Chọn một thí nghiệm để bắt đầu</div>
                <div class="viewer-badge">Nền tảng PhET HTML5</div>
            </div>
            <div class="iframe-container">
                <div class="loading-overlay" id="loading-overlay">
                    <i class="fas fa-satellite-dish"></i>
                    <p>Đang tải dữ liệu từ máy chủ PhET...</p>
                </div>
                <iframe id="phet-iframe" src="" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
        closeBtn.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });

        document.getElementById('phong-luyen-btn').addEventListener('click', () => {
            document.getElementById('phong-luyen-menu').classList.toggle('active');
        });
        document.getElementById('space-lab-btn').addEventListener('click', () => {
            document.getElementById('space-lab-menu').classList.toggle('active');
        });

        const phetData = [
            {
                category: "Điện & Từ Trường", icon: "fa-bolt",
                simulations: [
                    { name: "Lắp ráp mạch điện (DC)", link: "https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc_vi.html" },
                    { name: "Định luật Ohm", link: "https://phet.colorado.edu/sims/html/ohms-law/latest/ohms-law_vi.html" },
                    { name: "Định luật Faraday", link: "https://phet.colorado.edu/sims/html/faradays-law/latest/faradays-law_vi.html" },
                    { name: "Điện tích & Cảm ứng điện", link: "https://phet.colorado.edu/sims/html/balloons-and-static-electricity/latest/balloons-and-static-electricity_vi.html" }
                ]
            },
            {
                category: "Sóng Âm & Quang Học", icon: "fa-water",
                simulations: [
                    { name: "Giao thoa sóng", link: "https://phet.colorado.edu/sims/html/wave-interference/latest/wave-interference_vi.html" },
                    { name: "Sóng trên sợi dây", link: "https://phet.colorado.edu/sims/html/wave-on-a-string/latest/wave-on-a-string_vi.html" },
                    { name: "Khúc xạ ánh sáng", link: "https://phet.colorado.edu/sims/html/bending-light/latest/bending-light_vi.html" }
                ]
            },
            {
                category: "Cơ Học & Năng Lượng", icon: "fa-rocket",
                simulations: [
                    { name: "Con lắc lò xo", link: "https://phet.colorado.edu/sims/html/masses-and-springs/latest/masses-and-springs_vi.html" },
                    { name: "Con lắc đơn", link: "https://phet.colorado.edu/sims/html/pendulum-lab/latest/pendulum-lab_vi.html" },
                    { name: "Lực & Chuyển động", link: "https://phet.colorado.edu/sims/html/forces-and-motion-basics/latest/forces-and-motion-basics_vi.html" },
                    { name: "Năng lượng trượt băng", link: "https://phet.colorado.edu/sims/html/energy-skate-park/latest/energy-skate-park_vi.html" }
                ]
            },
            {
                category: "Nhiệt Động Lực Học", icon: "fa-temperature-high",
                simulations: [
                    { name: "Các trạng thái của vật chất", link: "https://phet.colorado.edu/sims/html/states-of-matter/latest/states-of-matter_vi.html" },
                    { name: "Biến đổi năng lượng", link: "https://phet.colorado.edu/sims/html/energy-forms-and-changes/latest/energy-forms-and-changes_vi.html" }
                ]
            }
        ];

        const listContainer = document.getElementById('simulation-list');
        const iframeEl = document.getElementById('phet-iframe');
        const viewerTitle = document.getElementById('viewer-title');
        const loadingOverlay = document.getElementById('loading-overlay');

        function renderMenu() {
            let htmlContent = '';
            phetData.forEach((group) => {
                htmlContent += `<div class="category-title"><i class="fas ${group.icon}" style="margin-right: 5px;"></i> ${group.category}</div>`;
                group.simulations.forEach((sim) => {
                    htmlContent += `<button class="sim-item" onclick="loadSimulation('${sim.name}', '${sim.link}', this)"><i class="far fa-play-circle"></i> ${sim.name}</button>`;
                });
            });
            listContainer.innerHTML = htmlContent;
        }

        function loadSimulation(name, url, btnElement) {
            document.querySelectorAll('.sim-item').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            viewerTitle.textContent = name;
            loadingOverlay.style.opacity = '1';
            iframeEl.src = url;
            iframeEl.onload = function() { loadingOverlay.style.opacity = '0'; };
        }

        window.onload = () => {
            renderMenu();
            const firstButton = listContainer.querySelector('.sim-item');
            if(firstButton) { firstButton.click(); }
        };
    </script>
</body>
</html>
